                        <body>
                            <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Homepage Content Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        .header {
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 20px;
        }
        
        h1 {
            color: #222;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        
        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .month-nav {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .month-nav button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        
        .month-nav button:hover {
            background: #0052a3;
        }
        
        .month-display {
            font-size: 18px;
            font-weight: 600;
            color: #222;
            min-width: 180px;
            text-align: center;
        }
        
        .legend {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            font-size: 13px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .legend-color {
            width: 24px;
            height: 24px;
            border-radius: 3px;
        }
        
        .calendar-wrapper {
            overflow-x: auto;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }
        
        .calendar {
            width: 100%;
            border-collapse: collapse;
        }
        
        .calendar thead {
            background: #f5f5f5;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .calendar th {
            padding: 12px;
            text-align: center;
            font-weight: 600;
            color: #333;
            border: 1px solid #e0e0e0;
            font-size: 12px;
            min-width: 100px;
        }
        
        .calendar td {
            padding: 8px;
            border: 1px solid #e0e0e0;
            vertical-align: top;
            font-size: 11px;
            min-height: 120px;
        }
        
        .calendar tbody tr:hover {
            background: #fafafa;
        }
        
        .slot-header {
            font-weight: 600;
            color: #222;
            width: 180px;
            min-width: 180px;
            background: #f9f9f9;
            border-right: 2px solid #ddd;
            position: sticky;
            left: 0;
            z-index: 5;
            padding: 12px !important;
        }
        
        .day-header {
            font-weight: 600;
            color: #222;
            padding: 12px;
            background: #f0f7ff;
            border-bottom: 2px solid #0066cc;
            text-align: center;
        }
        
        .day-number {
            display: block;
            font-size: 10px;
            color: #999;
            margin-bottom: 4px;
            font-weight: 500;
        }
        
        .spanning-promo {
            padding: 8px;
            margin-bottom: 4px;
            border-radius: 4px;
            font-size: 9px;
            line-height: 1.3;
            color: white;
            font-weight: 500;
        }
        
        .tier-block {
            padding: 3px;
            margin-bottom: 2px;
            border-radius: 2px;
            font-size: 9px;
            line-height: 1.25;
        }
        
        .tier-label {
            font-size: 7px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 1px;
            opacity: 0.9;
        }
        
        .tier-message {
            font-size: 9px;
            line-height: 1.25;
        }
        
        .default-cell {
            color: #d0d0d0;
            font-style: italic;
            font-size: 10px;
            text-align: center;
            padding: 8px !important;
        }
        
        .p19-bg {
            background: rgba(0, 0, 0, 0.15);
        }
        
        .national-bg {
            background: rgba(0, 0, 0, 0.2);
        }
        
        .all-tiers-bg {
            background: rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 2026 Homepage Content Calendar</h1>
            <p class="subtitle">All promotional messaging by slot and date</p>
        </div>
        
        <div class="calendar-controls">
            <div class="month-nav">
                <button onclick="previousMonth()">← Previous</button>
                <div class="month-display" id="monthDisplay"></div>
                <button onclick="nextMonth()">Next →</button>
            </div>
        </div>
        
        <div class="legend" id="legend"></div>
        
        <div class="calendar-wrapper">
            <table class="calendar" id="calendar"></table>
        </div>
    </div>

    <script>
        let currentMonth = new Date(2026, 5); // June 2026

        const promotions = [
            { name: 'Hello Summer Sale', startDate: new Date(2026, 5, 2), endDate: new Date(2026, 5, 10) },
            { name: 'No Payments until July 1st', startDate: new Date(2026, 5, 11), endDate: new Date(2026, 5, 17) },
            { name: 'Weekend Flash Sale', startDate: new Date(2026, 5, 18), endDate: new Date(2026, 5, 21) },
            { name: 'Hot Summer Savings', startDate: new Date(2026, 5, 22), endDate: new Date(2026, 5, 30) },
            { name: 'Black Friday All Month Long', startDate: new Date(2026, 6, 1), endDate: new Date(2026, 6, 31) },
            { name: '4th of July Weekend Flash Sale', startDate: new Date(2026, 6, 3), endDate: new Date(2026, 6, 6) },
            { name: 'Sizzling Summer Savings', startDate: new Date(2026, 6, 16), endDate: new Date(2026, 6, 24) },
            { name: 'Last Chance: Black Friday All Month Long', startDate: new Date(2026, 6, 25), endDate: new Date(2026, 6, 31) }
        ];

        const slotMessaging = [
            { slot: 'Hero', promo: 'Hello Summer Sale', tier: 'P19', message: 'Up to $900 Off Your Lease on Select Products', priority: null },
            { slot: 'Hero', promo: 'Hello Summer Sale', tier: 'National', message: 'Up to $200 Off Your Lease on Select Products', priority: null },
            { slot: 'Limited Time Deal 1', promo: 'Hello Summer Sale', tier: 'P19', message: 'Element 65" TV Starting At $59.99/MO', priority: null },
            { slot: 'Limited Time Deal 1', promo: 'Hello Summer Sale', tier: 'National', message: 'Save Big on Select TVs', priority: null },
            { slot: 'Limited Time Deal 2', promo: 'Hello Summer Sale', tier: 'P19', message: 'Up to $100 Off Mowers', priority: null },
            { slot: 'Limited Time Deal 2', promo: 'Hello Summer Sale', tier: 'National', message: 'All Mowers On Sale Now', priority: null },
            { slot: 'Limited Time Deal 3', promo: 'Hello Summer Sale', tier: 'P19', message: 'Laundry Event: Up to $40 Off/Month', priority: null },
            { slot: 'Limited Time Deal 3', promo: 'Hello Summer Sale', tier: 'National', message: 'Laundry Event: Limited Time Savings on Select Washers/Dryers', priority: null },
            { slot: 'Limited Time Deal 4', promo: 'Hello Summer Sale', tier: 'All Tiers', message: 'Even Lower Payments Starting at $9.24/WK', priority: null },
            { slot: 'Featured Deal Tile 1', promo: 'Hello Summer Sale', tier: 'P19', message: 'Up to $900 Off Your Lease on Select Products', priority: null },
            { slot: 'Featured Deal Tile 1', promo: 'Hello Summer Sale', tier: 'National', message: 'Up to $200 Off Your Lease on Select Products', priority: null },
            { slot: 'Menu Flyout 1', promo: 'Hello Summer Sale', tier: 'P19', message: 'Up to $900 Off Your Lease on Select Products', priority: null },
            { slot: 'Menu Flyout 1', promo: 'Hello Summer Sale', tier: 'National', message: 'Up to $200 Off Your Lease on Select Products', priority: null },
            { slot: 'Ribbon in Grid', promo: 'Hello Summer Sale', tier: 'P19', message: 'Up to $900 Off Your Lease on Select Products', priority: null },
            { slot: 'Ribbon in Grid', promo: 'Hello Summer Sale', tier: 'National', message: 'Up to $200 Off Your Lease on Select Products', priority: null },
            { slot: 'Sale Page Visual Nav', promo: 'Hello Summer Sale', tier: 'P19', message: 'Up to $900 Off Your Lease on Select Products', priority: null },
            { slot: 'Sale Page Visual Nav', promo: 'Hello Summer Sale', tier: 'National', message: 'Up to $200 Off Your Lease on Select Products', priority: null },
            { slot: 'Location Page Tile', promo: 'Hello Summer Sale', tier: 'All Tiers', message: 'Up to $200 Off Your Lease on Select Products', priority: null },
            { slot: 'Google Posting', promo: 'Hello Summer Sale', tier: 'All Tiers', message: 'Up to $200 Off Your Lease on Select Products', priority: null },
            { slot: 'Hero', promo: 'No Payments until July 1st', tier: 'All Tiers', message: 'No Payments Until July 1', priority: null },
            { slot: 'Limited Time Deal 1', promo: 'No Payments until July 1st', tier: 'P19', message: '20% Off Select Washers/Dryers', priority: null },
            { slot: 'Limited Time Deal 1', promo: 'No Payments until July 1st', tier: 'National', message: 'Save Big on Select Washers/Dryers', priority: null },
            { slot: 'Limited Time Deal 2', promo: 'No Payments until July 1st', tier: 'P19', message: 'Up to $100 Off Mowers', priority: null },
            { slot: 'Limited Time Deal 2', promo: 'No Payments until July 1st', tier: 'National', message: 'All Mowers On Sale Now', priority: null },
            { slot: 'Limited Time Deal 3', promo: 'No Payments until July 1st', tier: 'P19', message: 'Bedroom Sets Starting at $19.63/WK', priority: null },
            { slot: 'Limited Time Deal 3', promo: 'No Payments until July 1st', tier: 'National', message: 'Bedroom Sets on Sale', priority: null },
            { slot: 'Limited Time Deal 4', promo: 'No Payments until July 1st', tier: 'All Tiers', message: 'Drive Into Summer Sweepstakes', priority: null },
            { slot: 'Featured Deal Tile 1', promo: 'No Payments until July 1st', tier: 'All Tiers', message: 'No Payments Until July 1', priority: null },
            { slot: 'Menu Flyout 1', promo: 'No Payments until July 1st', tier: 'All Tiers', message: 'No Payments Until July 1', priority: null },
            { slot: 'Ribbon in Grid', promo: 'No Payments until July 1st', tier: 'All Tiers', message: 'No Payments Until July 1', priority: null },
            { slot: 'Sale Page Visual Nav', promo: 'No Payments until July 1st', tier: 'All Tiers', message: 'No Payments Until July 1', priority: null },
            { slot: 'Location Page Tile', promo: 'No Payments until July 1st', tier: 'All Tiers', message: 'No Payments Until July 1', priority: null },
            { slot: 'Google Posting', promo: 'No Payments until July 1st', tier: 'All Tiers', message: 'No Payments Until July 1', priority: null }
        ];

        const slots = [...new Set(slotMessaging.map(m => m.slot))];

        const colorPalette = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B88B', '#A8E6CF'];
        let promoColors = {};
        let colorIndex = 0;

        function getPromoColor(promoName) {
            if (!promoColors[promoName]) {
                promoColors[promoName] = colorPalette[colorIndex % colorPalette.length];
                colorIndex++;
            }
            return promoColors[promoName];
        }

        function buildLegend() {
            const legendDiv = document.getElementById('legend');
            legendDiv.innerHTML = '';
            promotions.forEach(promo => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                const color = document.createElement('div');
                color.className = 'legend-color';
                color.style.backgroundColor = getPromoColor(promo.name);
                const label = document.createElement('span');
                label.textContent = promo.name;
                item.appendChild(color);
                item.appendChild(label);
                legendDiv.appendChild(item);
            });
        }

        function renderCalendar() {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            
            document.getElementById('monthDisplay').textContent = 
                currentMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const lastDay = new Date(year, month + 1, 0).getDate();

            let html = '<thead><tr><th class="slot-header">Slot</th>';
            for (let day = 1; day <= lastDay; day++) {
                const date = new Date(year, month, day);
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                html += `<th class="day-header"><span class="day-number">${dayName}</span>${day}</th>`;
            }
            html += '</tr></thead><tbody>';

            slots.forEach(slot => {
                html += `<tr><td class="slot-header">${slot}</td>`;
                
                let day = 1;
                while (day <= lastDay) {
                    const cellDate = new Date(year, month, day);
                    const activePromo = promotions.find(p => cellDate >= p.startDate && cellDate <= p.endDate);
                    
                    if (activePromo) {
                        // Calculate span
                        const promoEndDay = Math.min(activePromo.endDate.getDate(), lastDay);
                        const span = promoEndDay - day + 1;
                        
                        // Get all messages for this slot/promo
                        const messages = slotMessaging.filter(m => 
                            m.slot === slot && m.promo === activePromo.name
                        );
                        
                        let cellContent = '<span class="default-cell">default</span>';
                        if (messages.length > 0) {
                            cellContent = `<div class="spanning-promo" style="background-color: ${getPromoColor(activePromo.name)}">`;
                            
                            messages.forEach(msg => {
                                const bgClass = msg.tier === 'P19' ? 'p19-bg' : msg.tier === 'National' ? 'national-bg' : 'all-tiers-bg';
                                cellContent += `<div class="tier-block ${bgClass}">
                                    <div class="tier-label">${msg.tier}</div>
                                    <div class="tier-message">${msg.message}</div>
                                </div>`;
                            });
                            
                            cellContent += '</div>';
                        }
                        
                        html += `<td colspan="${span}">${cellContent}</td>`;
                        day = promoEndDay + 1;
                    } else {
                        html += `<td><span class="default-cell">default</span></td>`;
                        day++;
                    }
                }
                html += '</tr>';
            });
            html += '</tbody>';

            document.getElementById('calendar').innerHTML = html;
        }

        function previousMonth() {
            currentMonth.setMonth(currentMonth.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentMonth.setMonth(currentMonth.getMonth() + 1);
            renderCalendar();
        }

        // Initialize
        buildLegend();
        renderCalendar();
    </script>
</body>
</html>

                        </html>
